name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.18"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras

      - name: Lint and format
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: CPU tests and release policy
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          uv run --frozen pytest -q -p no:cacheprovider
          uv run --frozen python -m release_checks.cli

      - name: Export public Space bundle
        run: >-
          uv run --frozen python scripts/export_hf_space.py
          --destination "${{ runner.temp }}/hf-space"

      - name: Build non-root public Space image
        run: >-
          docker build -t local-inference-bench-gateway-space:rc
          "${{ runner.temp }}/hf-space"

      - name: Smoke public Space without network
        run: |
          set -euo pipefail
          docker run -d --name local-inference-space-smoke --network none local-inference-bench-gateway-space:rc
          runtime_user="$(docker inspect --format '{{.Config.User}}' local-inference-space-smoke)"
          test "$runtime_user" = "10001:10001"
          now_us() {
            local stamp="${EPOCHREALTIME/./}"
            printf '%s\n' "$((10#$stamp))"
          }
          duration_seconds() {
            local duration_us="$1"
            printf '%d.%06d\n' "$((duration_us / 1000000))" "$((duration_us % 1000000))"
          }
          health_deadline_ms=55000
          health_minimum_probe_ms=1000
          health_probe_timeout_ms=3000
          health_sleep_ms=1000
          health_attempt_limit=45
          healthy=0
          started_us="$(now_us)"
          deadline_us=$((started_us + health_deadline_ms * 1000))
          for attempt in $(seq 1 "$health_attempt_limit"); do
            current_us="$(now_us)"
            remaining_us=$((deadline_us - current_us))
            if [ "$remaining_us" -le 0 ]; then break; fi
            remaining_ms=$((remaining_us / 1000))
            if [ "$remaining_ms" -lt "$health_minimum_probe_ms" ]; then break; fi
            bounded_probe_ms="$health_probe_timeout_ms"
            if [ "$remaining_ms" -lt "$bounded_probe_ms" ]; then
              bounded_probe_ms="$remaining_ms"
            fi
            if uv run --frozen python -m release_checks.bounded_command --timeout-ms "$bounded_probe_ms" -- docker exec local-inference-space-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/_stcore/health', timeout=0.2).read()"; then
              completed_us="$(now_us)"
              if [ "$completed_us" -le "$deadline_us" ]; then
                healthy=1
              fi
              break
            fi
            current_us="$(now_us)"
            remaining_us=$((deadline_us - current_us))
            if [ "$remaining_us" -le 0 ]; then break; fi
            sleep_us=$((health_sleep_ms * 1000))
            bounded_sleep_us="$sleep_us"
            if [ "$remaining_us" -lt "$bounded_sleep_us" ]; then
              bounded_sleep_us="$remaining_us"
            fi
            sleep "$(duration_seconds "$bounded_sleep_us")"
          done
          if [ "$healthy" -ne 1 ]; then
            uv run --frozen python -m release_checks.bounded_command --timeout-ms 5000 -- docker logs local-inference-space-smoke >&2 || true
            exit 1
          fi
          if ! forbidden="$(uv run --frozen python -m release_checks.bounded_command --timeout-ms 5000 -- docker exec local-inference-space-smoke find /app -type f \( -name '*.db' -o -name '*.sqlite*' -o -name '*.gguf' -o -name '*.safetensors' -o -name '*.onnx' -o -name '*.jsonl' \))"; then
            uv run --frozen python -m release_checks.bounded_command --timeout-ms 5000 -- docker logs local-inference-space-smoke >&2 || true
            exit 1
          fi
          test -z "$forbidden"

      - name: Always capture public Space logs
        if: always()
        run: uv run --frozen python -m release_checks.bounded_command --timeout-ms 5000 -- docker logs local-inference-space-smoke >&2 || true

      - name: Always remove public Space smoke container
        if: always()
        run: uv run --frozen python -m release_checks.bounded_command --timeout-ms 10000 -- docker rm -f local-inference-space-smoke || true

      - name: Build non-root production image
        run: docker build -t local-inference-bench-gateway:rc .

      - name: CPU-only Compose smoke
        run: >-
          docker compose -f compose.smoke.yaml up --build --abort-on-container-exit
          --exit-code-from smoke-client

      - name: Always remove smoke resources
        if: always()
        run: docker compose -f compose.smoke.yaml down --volumes --remove-orphans
