# Model registry: alias -> ordered list of backends (first = primary, rest = failover targets).
# The gateway walks this list at request time when a primary has a retryable failure.
# "fast" demonstrates one GGUF exposed by two engines; "smart" shows a different model alias.
#
# max_concurrent caps in-flight requests per alias; the gateway rejects with 429 instead of
# queueing once the cap is hit (see gateway/concurrency.py and PRODUCTION_SCALING.md). Omit the
# field (as "smart" does below) for no limit. 4 here is deliberately low so a handful of
# concurrent requests is enough to demonstrate it -- not a claim about llama-server's real
# capacity (the recorded benchmark reached 16, but this local demo limit is intentionally lower).

models:
  fast:
    max_concurrent: 4
    backends:
      - name: llamacpp
        base_url: "http://127.0.0.1:8080/v1"
        model: "bench-model"
        api_key: null
      - name: ollama
        base_url: "http://127.0.0.1:11434/v1"
        model: "bench-model-c"
        api_key: "ollama"

  smart:
    backends:
      - name: ollama-smart
        base_url: "http://127.0.0.1:11434/v1"
        model: "qwen3:8b"
        api_key: "ollama"
