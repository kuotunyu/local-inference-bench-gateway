# Normal Docker deployment connects to separately managed host inference services.
models:
  fast:
    max_concurrent: 4
    backends:
      - name: llamacpp
        base_url: "http://host.docker.internal:8080/v1"
        model: "bench-model"
        api_key: null
      - name: ollama
        base_url: "http://host.docker.internal:11434/v1"
        model: "bench-model-c"
        api_key: "ollama"

  smart:
    backends:
      - name: ollama-smart
        base_url: "http://host.docker.internal:11434/v1"
        model: "qwen3:8b"
        api_key: "ollama"
