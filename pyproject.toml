[project]
name = "local-inference-bench-gateway"
version = "0.1.0"
description = "Auditable local inference benchmark artifacts and an OpenAI-compatible gateway"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
bench = [
    "matplotlib>=3.9,<4.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<4.0",
    "tqdm>=4.66,<5.0",
]
dashboard = [
    "pandas>=2.2,<4.0",
    "streamlit>=1.40,<2.0",
]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "respx>=0.22,<1.0",
    "ruff>=0.12,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
